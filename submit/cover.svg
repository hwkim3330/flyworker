<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#000"/>

  <text x="100" y="112" font-family="Helvetica,Arial" font-size="54" font-weight="600" fill="#f5f5f7" letter-spacing="-1">Fly Worker</text>
  <text x="440" y="112" font-family="Helvetica,Arial" font-size="27" fill="#86868b">A QA fuzzer for browser games</text>
  <line x1="100" y1="146" x2="1820" y2="146" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1"/>

  <!-- 핵심 문장 -->
  <text x="100" y="236" font-family="Helvetica,Arial" font-size="44" font-weight="600" fill="#f5f5f7" letter-spacing="-0.8">It plays your game, finds bugs, and reproduces them exactly.</text>
  <text x="100" y="296" font-family="Helvetica,Arial" font-size="44" font-weight="600" fill="#30d158" letter-spacing="-0.8">One of its policies is a real fly brain. That one loses.</text>

  <text x="100" y="360" font-family="Helvetica,Arial" font-size="23" fill="#a1a1a6">138,639 neurons · 2.7M connections · zero LLM inference · runs entirely in your browser</text>

  <!-- 왼쪽: 정책 비교 (측정) -->
  <rect x="100" y="410" width="900" height="330" rx="18" fill="#141416" stroke="#ffffff" stroke-opacity="0.09"/>
  <text x="132" y="458" font-family="Helvetica,Arial" font-size="24" font-weight="600" fill="#f5f5f7">Policies, measured</text>
  <text x="392" y="458" font-family="Helvetica,Arial" font-size="18" fill="#6e6e73">24,000 frames each · seeded · averaged over repeats</text>
  <g font-family="Helvetica,Arial" font-size="19">
    <text x="132" y="506" fill="#6e6e73">Policy</text>
    <text x="520" y="506" fill="#6e6e73">Coverage · range</text>
    <text x="760" y="506" fill="#6e6e73">Types</text>
    <line x1="132" y1="522" x2="968" y2="522" stroke="#ffffff" stroke-opacity="0.09"/>

    <text x="132" y="562" fill="#30d158" font-weight="600">Fly connectome</text>
    <text x="520" y="562" fill="#30d158" font-family="Menlo,monospace">34%</text>
    <text x="620" y="562" font-size="16" fill="#6e6e73" font-family="Menlo,monospace">28–41</text>
    <text x="760" y="562" fill="#30d158" font-family="Menlo,monospace">2.7</text>
    <text x="840" y="562" font-size="17" fill="#6e6e73">loses on both</text>

    <text x="132" y="606" fill="#a1a1a6">Smoothed noise</text>
    <text x="520" y="606" fill="#f5f5f7" font-family="Menlo,monospace">61%</text>
    <text x="620" y="606" font-size="16" fill="#6e6e73" font-family="Menlo,monospace">57–66</text>
    <text x="760" y="606" fill="#f5f5f7" font-family="Menlo,monospace">3.2</text>
    <text x="840" y="606" font-size="17" fill="#6e6e73">all five seen</text>

    <text x="132" y="650" fill="#a1a1a6">Uniform noise</text>
    <text x="520" y="650" fill="#f5f5f7" font-family="Menlo,monospace">50%</text>
    <text x="620" y="650" font-size="16" fill="#6e6e73" font-family="Menlo,monospace">46–52</text>
    <text x="760" y="650" fill="#f5f5f7" font-family="Menlo,monospace">3.6</text>

    <text x="132" y="694" fill="#a1a1a6">Straight ahead</text>
    <text x="520" y="694" fill="#f5f5f7" font-family="Menlo,monospace">5%</text>
    <text x="620" y="694" font-size="16" fill="#6e6e73" font-family="Menlo,monospace">5–5</text>
    <text x="760" y="694" fill="#f5f5f7" font-family="Menlo,monospace">1.0</text>
    <text x="840" y="694" font-size="17" fill="#6e6e73">one freeze ×95</text>
  </g>

  <!-- 오른쪽: 파이프라인 -->
  <rect x="1040" y="410" width="780" height="330" rx="18" fill="#141416" stroke="#ffffff" stroke-opacity="0.09"/>
  <text x="1072" y="458" font-family="Helvetica,Arial" font-size="24" font-weight="600" fill="#f5f5f7">The framework is the product</text>
  <text x="1072" y="492" font-family="Helvetica,Arial" font-size="18" fill="#6e6e73">the policy is swappable; everything else is the value</text>
  <g font-family="Helvetica,Arial" font-size="20">
    <text x="1072" y="552" fill="#0a84ff" font-family="Menlo,monospace">1</text>
    <text x="1112" y="552" fill="#f5f5f7">Attach</text>
    <text x="1260" y="552" fill="#86868b">synthetic keys + framebuffer — no</text>
    <text x="1260" y="580" fill="#86868b">source access, no game-side interface</text>

    <text x="1072" y="632" fill="#0a84ff" font-family="Menlo,monospace">2</text>
    <text x="1112" y="632" fill="#f5f5f7">Detect</text>
    <text x="1260" y="632" fill="#86868b">five symptom rules, deterministic —</text>
    <text x="1260" y="660" fill="#86868b">no model decides what counts as a bug</text>

    <text x="1072" y="712" fill="#0a84ff" font-family="Menlo,monospace">3</text>
    <text x="1112" y="712" fill="#f5f5f7">Reproduce</text>
    <text x="1260" y="712" fill="#30d158">seed + input sequence — 12/12 exact</text>
  </g>

  <!-- 하단 3칸 -->
  <g font-family="Helvetica,Arial">
    <rect x="100" y="782" width="548" height="150" rx="18" fill="#141416" stroke="#ffffff" stroke-opacity="0.09"/>
    <text x="132" y="828" font-size="23" font-weight="600" fill="#f5f5f7">Four workplaces</text>
    <text x="132" y="864" font-size="18" fill="#86868b">GTA1 · DOOM · a lab game with four</text>
    <text x="132" y="892" font-size="18" fill="#86868b">planted bugs · and your own game</text>

    <rect x="686" y="782" width="548" height="150" rx="18" fill="#141416" stroke="#ffffff" stroke-opacity="0.09"/>
    <text x="718" y="828" font-size="23" font-weight="600" fill="#f5f5f7">Bug count is a fake metric</text>
    <text x="718" y="864" font-size="18" fill="#86868b">so we report coverage and symptom</text>
    <text x="718" y="892" font-size="18" fill="#86868b">diversity, and we lose on both</text>

    <rect x="1272" y="782" width="548" height="150" rx="18" fill="#141416" stroke="#ffffff" stroke-opacity="0.09"/>
    <text x="1304" y="828" font-size="23" font-weight="600" fill="#f5f5f7">Why the fly loses</text>
    <text x="1304" y="864" font-size="18" fill="#86868b">ON pathway dead, T4 never fires —</text>
    <text x="1304" y="892" font-size="18" fill="#86868b">wiring without dynamics. All published.</text>
  </g>

  <text x="100" y="1000" font-family="Menlo,monospace" font-size="21" fill="#6e6e73">FlyWire v783 (CC-BY 4.0) · Shiu et al. LIF · doom.wasm · carnage3d (MIT)</text>
  <text x="100" y="1036" font-family="Menlo,monospace" font-size="21" fill="#0a84ff">huggingface.co/spaces/kimhyunwoo/flyworker</text>
</svg>
